services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_USER: insight
      MARIADB_PASSWORD: insight
      MARIADB_DATABASE: insight
      MARIADB_ROOT_PASSWORD: insight
    ports:
      - "3306:3306"
    command:
      - --innodb-buffer-pool-size=128M
      - --max-allowed-packet=64M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./internal/store/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations/02-grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro

volumes:
  mariadb_data:
