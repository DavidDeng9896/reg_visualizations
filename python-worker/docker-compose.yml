services:
  python-worker:
    build: .
    image: insight-python-worker:local
    ports:
      - "8091:8091"
    environment:
      - PYTHONUNBUFFERED=1
    # Resource limits for untrusted user code (tune per host).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
