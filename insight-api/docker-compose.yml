services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.pg.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  pgdata:
